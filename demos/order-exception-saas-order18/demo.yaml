id: order-exception-saas-order18
title: 合成受注SO-24018の通常便承諾と出荷判断
kind: sample-app
status: exploring
audience: 卸売会社の受注担当者・出荷責任者、Agent開発者
scope: 固定合成受注の不足15箱を調べ、通常便の遅延承諾と別担当の出荷判断を経て保存結果を確認する。
implementation: 局所実モデルの2 Tool、SQLite業務API、React/MUI画面、合成顧客の自己申告、局所Keycloakと隔離OpenFGAで認証した合成Bob役を用いる。本人限定Tailnet Serveは別途構成する。
relatedDemos: []
summary: Agentの二案と人の承諾・判断を同じ合成受注で追い、承諾なしの拒否と出荷指示の保存を確かめる。
goal: 出荷例外をAgentに調べさせ、人がどこで介入するかを業務状態とともに評価する。
questions:
  - Agentの案は受注・在庫・便・契約の根拠に合うか
  - 通常便の遅延と分納を別々に承諾しなければ出荷を止められるか
  - 別担当の認証と承認後にだけ正しい出荷指示を保存するか
tags: [sample-app, b2b, order-fulfillment, ai-platform, mui]
stack: [python, react, mui, vite]
findings:
  - 2026-11-13、SO-24018の稼働候補から固定合成資料と実行コードを独立したソースへ移した。新ソースからの実走と配備切替の採否は別途記録する。
